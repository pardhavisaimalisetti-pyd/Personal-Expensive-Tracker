<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PyFin Expense Tracker</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
            border-top: 3px solid var(--neon-blue);
        }
        .auth-card:hover {
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            border-top-color: var(--neon-purple);
        }
        .auth-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .auth-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .auth-form .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .auth-btn {
            width: 100%;
            justify-content: center;
            margin-top: 20px;
            padding: 14px;
        }
        .auth-links {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .auth-links a {
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .auth-links a:hover {
            color: var(--neon-purple);
            text-shadow: 0 0 8px rgba(240, 147, 251, 0.5);
        }
    </style>
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-logo">
                <i class="fa-brands fa-python neon-text"></i>
                <span>Py<span class="neon-text">Fin</span></span>
            </div>
            <p class="auth-subtitle">Sign in to your account to continue</p>
            
            <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn glow-button auth-btn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="#">Sign up here</a></p>
                <p style="margin-top: 10px;"><a href="home.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
            </div>
        </div>
    </div>
</body>
</html>
