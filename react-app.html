<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyFin - React.js AI Finance Dashboard</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- App CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .react-badge {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .ai-pill {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #00f2fe;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            animation: fadeIn 0.3s ease-in-out;
            cursor: pointer;
        }
        .ai-pill:hover {
            background: rgba(0, 242, 254, 0.25);
        }
        .anomaly-alert {
            background: rgba(255, 75, 43, 0.15);
            border: 1px solid rgba(255, 75, 43, 0.5);
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }
        .ml-stats-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .nav-switch-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .nav-switch-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div id="root"></div>

    <!-- React 18 JSX Application -->
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        function App() {
            const [transactions, setTransactions] = useState([]);
            const [forecast, setForecast] = useState(null);
            const [mlMetrics, setMlMetrics] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showRetrainModal, setShowRetrainModal] = useState(false);

            // Form State
            const [desc, setDesc] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('Expense');
            const [category, setCategory] = useState('Food');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [method, setMethod] = useState('Debit Card');

            // AI Inference Live State
            const [aiCategorySuggestion, setAiCategorySuggestion] = useState(null);
            const [anomalyWarning, setAnomalyWarning] = useState(null);

            // Fetch Transactions & ML Forecast
            const loadData = useCallback(async () => {
                try {
                    const [txRes, forecastRes, metricsRes] = await Promise.all([
                        fetch('/api/transactions'),
                        fetch('/api/ml/forecast'),
                        fetch('/api/ml/metrics')
                    ]);
                    
                    if (txRes.ok) setTransactions(await txRes.json());
                    if (forecastRes.ok) setForecast(await forecastRes.json());
                    if (metricsRes.ok) setMlMetrics(await metricsRes.json());
                } catch (err) {
                    console.error("Error loading API data:", err);
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                loadData();
            }, [loadData]);

            // Debounced AI Category Prediction when typing Description
            useEffect(() => {
                if (!desc || desc.trim().length < 3) {
                    setAiCategorySuggestion(null);
                    return;
                }
                const timer = setTimeout(async () => {
                    try {
                        const res = await fetch('/api/ml/predict-category', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ desc })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.confidence >= 0.45) {
                                setAiCategorySuggestion(data);
                            }
                        }
                    } catch (e) {
                        console.error("NLP Prediction error:", e);
                    }
                }, 300);

                return () => clearTimeout(timer);
            }, [desc]);

            // Live Anomaly Check when entering Amount & Category
            useEffect(() => {
                const num = parseFloat(amount);
                if (isNaN(num) || num <= 0 || type !== 'Expense') {
                    setAnomalyWarning(null);
                    return;
                }
                const timer = setTimeout(async () => {
                    try {
                        const res = await fetch('/api/ml/detect-anomaly', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ amount: num, category })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.is_anomaly) {
                                setAnomalyWarning(data.message);
                            } else {
                                setAnomalyWarning(null);
                            }
                        }
                    } catch (e) {
                        console.error("Anomaly Check error:", e);
                    }
                }, 350);

                return () => clearTimeout(timer);
            }, [amount, category, type]);

            // Add Transaction
            const handleAddTransaction = async (e) => {
                e.preventDefault();
                if (!desc || !amount) return;

                const payload = {
                    desc,
                    amount: parseFloat(amount),
                    type,
                    category,
                    date,
                    method
                };

                try {
                    const res = await fetch('/api/transactions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        setDesc('');
                        setAmount('');
                        setAiCategorySuggestion(null);
                        setAnomalyWarning(null);
                        loadData();
                    }
                } catch (err) {
                    console.error("Failed to add transaction:", err);
                }
            };

            // Delete Transaction
            const handleDelete = async (id) => {
                try {
                    await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                    setTransactions(prev => prev.filter(t => t.id !== id));
                    loadData();
                } catch (err) {
                    console.error("Failed to delete transaction:", err);
                }
            };

            // Retrain Models
            const handleRetrain = async () => {
                try {
                    const res = await fetch('/api/ml/retrain', { method: 'POST' });
                    if (res.ok) {
                        alert("AI Models retrained successfully on latest transaction data!");
                        loadData();
                    }
                } catch (e) {
                    alert("Error retraining models.");
                }
            };

            // Statistics Calculations
            const stats = useMemo(() => {
                let income = 0;
                let expense = 0;
                transactions.forEach(t => {
                    if (t.type === 'Income') income += t.amount;
                    else expense += t.amount;
                });
                const balance = income - expense;
                const savingsPct = income > 0 ? Math.max(0, Math.round((balance / income) * 100)) : 0;
                return { income, expense, balance, savingsPct };
            }, [transactions]);

            return (
                <div className="app-container glass-panel" style={{ display: 'block', maxWidth: '1200px', margin: '30px auto', padding: '30px' }}>
                    
                    {/* Header Bar */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '25px', flexWrap: 'wrap', gap: '15px' }}>
                        <div>
                            <h1 className="glowing-heading" style={{ fontSize: '28px', display: 'flex', alignItems: 'center' }}>
                                <i className="fa-brands fa-react" style={{ color: '#00d2ff', marginRight: '10px' }}></i>
                                PyFin React Dashboard
                                <span className="react-badge"><i className="fa-brands fa-react"></i> React 18</span>
                                <span className="react-badge" style={{ background: 'linear-gradient(135deg, #f093fb, #f5576c)' }}>
                                    <i className="fa-solid fa-brain"></i> Scikit-Learn
                                </span>
                            </h1>
                            <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginTop: '4px' }}>
                                Full-Stack React.js client integrated with Python Flask REST API & ML Services.
                            </p>
                        </div>
                        <div style={{ display: 'flex', gap: '10px' }}>
                            <a href="index.html" className="nav-switch-btn">
                                <i className="fa-solid fa-arrow-left"></i> Classic View
                            </a>
                            <button onClick={handleRetrain} className="btn glow-button" style={{ padding: '8px 16px', fontSize: '13px' }}>
                                <i className="fa-solid fa-rotate"></i> Retrain AI
                            </button>
                        </div>
                    </div>

                    {/* Stats Grid */}
                    <div className="stats-grid" style={{ marginBottom: '25px' }}>
                        <div className="stat-card glass-card hover-green">
                            <div className="stat-icon income-icon"><i className="fa-solid fa-arrow-trend-up"></i></div>
                            <div className="stat-details">
                                <p>Total Income</p>
                                <h3 className="counter">₹{stats.income.toFixed(2)}</h3>
                            </div>
                        </div>

                        <div className="stat-card glass-card hover-pink">
                            <div className="stat-icon expense-icon"><i className="fa-solid fa-arrow-trend-down"></i></div>
                            <div className="stat-details">
                                <p>Total Expenses</p>
                                <h3 className="counter">₹{stats.expense.toFixed(2)}</h3>
                            </div>
                        </div>

                        <div className="stat-card glass-card hover-blue">
                            <div className="stat-icon balance-icon"><i className="fa-solid fa-wallet"></i></div>
                            <div className="stat-details">
                                <p>Remaining Balance</p>
                                <h3 className="counter">₹{stats.balance.toFixed(2)}</h3>
                            </div>
                        </div>

                        <div className="stat-card glass-card hover-orange">
                            <div className="stat-icon" style={{ background: 'rgba(250, 112, 154, 0.15)', color: 'var(--orange-glow)', width: '50px', height: '50px', borderRadius: '14px', display: 'flex', justifyContent: 'center', alignItems: 'center' }}>
                                <i className="fa-solid fa-wand-magic-sparkles"></i>
                            </div>
                            <div className="stat-details">
                                <p>AI Month Forecast</p>
                                <h3 className="counter">₹{forecast ? forecast.predicted_total.toFixed(2) : '0.00'}</h3>
                                <small style={{ color: 'var(--text-muted)', fontSize: '11px' }}>
                                    {forecast ? forecast.model_used : 'Ridge Regression'}
                                </small>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Layout: Form & Transactions */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: '25px' }}>
                        
                        {/* Transaction Form Card */}
                        <div className="glass-card hover-blue" style={{ height: 'fit-content' }}>
                            <h3 style={{ marginBottom: '20px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <i className="fa-solid fa-plus-circle" style={{ color: 'var(--neon-blue)' }}></i> Add Transaction
                            </h3>
                            
                            <form onSubmit={handleAddTransaction}>
                                <div style={{ display: 'grid', gap: '15px' }}>
                                    
                                    {/* Description with NLP Auto-Suggest */}
                                    <div className="form-group">
                                        <label>Description</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Swiggy biryani, Uber ride, Rent" 
                                            value={desc}
                                            onChange={(e) => setDesc(e.target.value)}
                                            required 
                                        />
                                        {aiCategorySuggestion && (
                                            <div 
                                                className="ai-pill"
                                                onClick={() => setCategory(aiCategorySuggestion.category)}
                                                title="Click to apply AI suggested category"
                                            >
                                                <i className="fa-solid fa-sparkles"></i>
                                                AI Suggests: <strong>{aiCategorySuggestion.category}</strong> ({(aiCategorySuggestion.confidence * 100).toFixed(0)}% confidence)
                                            </div>
                                        )}
                                    </div>

                                    {/* Amount with Anomaly Warning */}
                                    <div className="form-group">
                                        <label>Amount (₹)</label>
                                        <input 
                                            type="number" 
                                            step="0.01" 
                                            placeholder="0.00" 
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            required 
                                        />
                                        {anomalyWarning && (
                                            <div className="anomaly-alert">
                                                <i className="fa-solid fa-triangle-exclamation"></i>
                                                <span>{anomalyWarning}</span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Type & Category */}
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                        <div className="form-group">
                                            <label>Type</label>
                                            <select value={type} onChange={(e) => setType(e.target.value)}>
                                                <option value="Expense">Expense</option>
                                                <option value="Income">Income</option>
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>Category</label>
                                            <select value={category} onChange={(e) => setCategory(e.target.value)}>
                                                <option value="Food">Food</option>
                                                <option value="Travel">Travel</option>
                                                <option value="Bills">Bills</option>
                                                <option value="Shopping">Shopping</option>
                                                <option value="Salary">Salary</option>
                                                <option value="Pocket Money">Pocket Money</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Date & Payment Method */}
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                        <div className="form-group">
                                            <label>Date</label>
                                            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required />
                                        </div>
                                        <div className="form-group">
                                            <label>Method</label>
                                            <select value={method} onChange={(e) => setMethod(e.target.value)}>
                                                <option value="Credit Card">Credit Card</option>
                                                <option value="Debit Card">Debit Card</option>
                                                <option value="Cash">Cash</option>
                                                <option value="Bank Transfer">Bank Transfer</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button type="submit" className="btn btn-primary glow-button" style={{ marginTop: '5px' }}>
                                        <i className="fa-solid fa-plus"></i> Add Entry (React State)
                                    </button>
                                </div>
                            </form>
                        </div>

                        {/* Recent Transactions Table */}
                        <div className="glass-card hover-green">
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                                <h3><i className="fa-solid fa-list-check" style={{ color: 'var(--emerald-green)' }}></i> Transactions ({transactions.length})</h3>
                            </div>

                            <div style={{ maxHeight: '450px', overflowY: 'auto' }}>
                                <table className="transactions-table" style={{ width: '100%' }}>
                                    <thead>
                                        <tr>
                                            <th>Description</th>
                                            <th>Category</th>
                                            <th>Date</th>
                                            <th>Amount</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {transactions.length === 0 ? (
                                            <tr>
                                                <td colSpan="5" style={{ textAlign: 'center', padding: '30px', color: 'var(--text-muted)' }}>
                                                    No transactions found. Add one above!
                                                </td>
                                            </tr>
                                        ) : (
                                            transactions.slice().reverse().map((tx) => (
                                                <tr key={tx.id}>
                                                    <td><strong>{tx.desc}</strong></td>
                                                    <td>
                                                        <span className="category-tag">{tx.category}</span>
                                                    </td>
                                                    <td style={{ color: 'var(--text-muted)', fontSize: '13px' }}>{tx.date}</td>
                                                    <td style={{ fontWeight: 600, color: tx.type === 'Income' ? 'var(--emerald-green)' : 'var(--neon-pink)' }}>
                                                        {tx.type === 'Income' ? '+' : '-'}₹{parseFloat(tx.amount).toFixed(2)}
                                                    </td>
                                                    <td>
                                                        <button 
                                                            onClick={() => handleDelete(tx.id)}
                                                            className="delete-btn"
                                                            title="Delete transaction"
                                                            style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#ff6b6b' }}
                                                        >
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>

                    {/* ML Model Performance Suite */}
                    {mlMetrics && (
                        <div className="ml-stats-card">
                            <h4 style={{ marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <i className="fa-solid fa-microchip" style={{ color: '#00f2fe' }}></i> Active Machine Learning Models
                            </h4>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '15px' }}>
                                <div style={{ background: 'rgba(255,255,255,0.02)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                    <div style={{ fontWeight: 600, color: '#00d2ff' }}>1. NLP Categorizer</div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Algorithm: {mlMetrics.nlp_classifier?.algorithm || 'TF-IDF + Logistic Regression'}<br/>
                                        Accuracy: {(mlMetrics.nlp_classifier?.accuracy * 100 || 88).toFixed(1)}% | F1-Score: {mlMetrics.nlp_classifier?.f1_score || 0.88}
                                    </div>
                                </div>
                                <div style={{ background: 'rgba(255,255,255,0.02)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                    <div style={{ fontWeight: 600, color: 'var(--orange-glow)' }}>2. Expense Forecaster</div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Algorithm: {mlMetrics.forecaster?.algorithm || 'Ridge Regression'}<br/>
                                        MAE: ₹{mlMetrics.forecaster?.mae || 120} | R² Score: {mlMetrics.forecaster?.r2_score || 0.89}
                                    </div>
                                </div>
                                <div style={{ background: 'rgba(255,255,255,0.02)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(255,255,255,0.05)' }}>
                                    <div style={{ fontWeight: 600, color: '#f093fb' }}>3. Anomaly Detector</div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Algorithm: {mlMetrics.anomaly_detector?.algorithm || 'Isolation Forest'}<br/>
                                        Contamination: {mlMetrics.anomaly_detector?.contamination || 0.05}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
